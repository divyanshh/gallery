<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Europe Trip Reels</title>
<style>
:root{
  --bg:#f5f4ef;--panel:#ffffff;--panel2:#efeee8;--fg:#1b1b19;--mut:#6c6b64;--line:#e1dfd6;
  --acc:#FFD400;--acc-ink:#1b1b19;--link:#2563c9;--good:#1f8a4c;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0f0e;--panel:#191917;--panel2:#22221f;--fg:#ecebe4;--mut:#9a998f;--line:#2c2b27;--link:#8ab4ff;--good:#5fd08f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0f0f0e;--panel:#191917;--panel2:#22221f;--fg:#ecebe4;--mut:#9a998f;--line:#2c2b27;--link:#8ab4ff;
  --good:#5fd08f;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:22px 16px;background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800}
.brand b{display:block;font-size:15px}.brand span{font-size:12px;color:var(--mut)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--fg);font-weight:500}
.nav a:hover{background:var(--panel2)}.nav a.on{background:var(--acc);color:var(--acc-ink)}
.nav .ico{width:18px;text-align:center}
.side-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:22px 10px 6px}
.days a{display:flex;justify-content:space-between;padding:5px 10px;border-radius:8px;text-decoration:none;font-size:14px;color:var(--fg)}
.days a:hover{background:var(--panel2)}.days small{color:var(--mut)}
.side-foot{margin-top:24px;font-size:12px;color:var(--mut);padding:0 10px}
.themebtn{margin-top:10px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
main{padding:28px clamp(16px,3vw,40px) 80px;min-width:0;overflow-x:hidden}
.topbar{display:none}
h1{font-size:28px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:20px;margin:0}
.lead{color:var(--mut);margin:0 0 20px;max-width:720px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:22px}.stat span{font-size:12.5px;color:var(--mut)}
.day{margin-top:34px;scroll-margin-top:20px}
.dayh{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pill{display:inline-block;background:var(--acc);color:var(--acc-ink);font-weight:800;border-radius:99px;padding:3px 13px;font-size:15px}
.dayh .place{font-weight:600;font-size:18px}.dayh small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;
  display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.thumb{position:relative;aspect-ratio:3/4;background:#000;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .n{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.72);color:#fff;font-weight:700;font-size:12px;border-radius:99px;padding:2px 8px}
.thumb .k{position:absolute;top:8px;right:8px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:11px;border-radius:99px;padding:2px 8px}
.thumb .d{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;border-radius:6px;padding:1px 6px}
.card .body{padding:10px 12px 12px}.card .t{font-weight:650;line-height:1.3}.card .s{font-size:12.5px;color:var(--mut);margin-top:3px}
.pending{display:grid;place-items:center;text-align:center;color:var(--mut);height:100%;padding:12px;font-size:13px}
.drafts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:10px}
.draft{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:12px}
.draft img{width:100%;border-radius:8px;display:block;margin-bottom:8px}
.tagc{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut)}
/* reel page */
.crumb{font-size:13px;color:var(--mut);margin-bottom:12px}.crumb a{color:var(--mut)}
.reel{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:28px;align-items:start}.reel>div{min-width:0}
.player{position:sticky;top:18px}
.player .dplayer{border:0;width:100%;aspect-ratio:9/16;background:#000;border-radius:16px;display:block;box-shadow:var(--shadow)}
.pn{display:flex;gap:8px;margin-top:10px}
.pn a{flex:1;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;min-width:0}
.pn a small{display:block;color:var(--mut)}.pn a span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pn a.r{text-align:right}.pn .dis{opacity:.4;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.chip{background:var(--panel2);border-radius:99px;padding:3px 10px;font-size:12.5px}
.chip.acc{background:var(--acc);color:var(--acc-ink);font-weight:700}
.seg{display:inline-flex;background:var(--panel2);border-radius:10px;padding:3px;gap:3px;margin-bottom:14px}
.seg a{padding:5px 12px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600}
.seg a.on{background:var(--panel);box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 12px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--acc)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.cap{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font:inherit;font-size:14.5px;line-height:1.55}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tags span{color:var(--link);background:var(--panel2);border-radius:99px;padding:2px 10px;font-size:13px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--panel2);color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two figure{margin:0}.two img{width:100%;border-radius:10px;display:block;cursor:zoom-in}
.tg{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:0;color:#fff;white-space:nowrap}
.thumb .tg{position:absolute;left:8px;bottom:8px}.tg-ok{background:#1f9d55}.tg-fix{background:#d97706}.tg-rev{background:#2563eb}
.tg-new{background:#6b7280}.tg-x{background:#b91c1c}.tagbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.tagbar .tg{cursor:pointer;font-size:13px;padding:6px 12px}
.tagbar .tg.on{outline:2px solid var(--fg)}.okt{color:#1f9d55}.approve{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
table.songs{border-collapse:collapse;width:100%;margin-top:8px;font-size:13px}table.songs th,table.songs td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
figcaption{font-size:12.5px;color:var(--mut);margin-top:5px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.strip button{padding:0;border:0;background:none;cursor:pointer;position:relative}
.strip img{width:100%;border-radius:8px;display:block}
.strip span{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;border-radius:5px;padding:0 5px}
.mom{display:grid;grid-template-columns:64px 92px 1fr;gap:12px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.mom:hover{background:var(--panel2)}
.mom img{width:92px;border-radius:8px;display:block}
.time{font-variant-numeric:tabular-nums;font-weight:700;background:var(--panel2);border-radius:7px;padding:3px 0;text-align:center;font-size:13px}
.mom .what{font-weight:600}.mom .snd{font-size:12.5px;color:var(--mut)}
.k-sticker{color:#c58f00}.k-pause{color:#d0452e}.k-sound{color:var(--link)}.k-freeze,.k-behind,.k-label{color:var(--good)}
.line{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:6px 8px;border-radius:8px;cursor:pointer;align-items:center}
.line:hover{background:var(--panel2)}.line.on{background:var(--acc);color:var(--acc-ink)}
.line.on .time{background:rgba(0,0,0,.12)}
.next{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--panel2);border-radius:12px;padding:10px}
.next img{width:64px;border-radius:8px}.next small{color:var(--mut);display:block}
.files a{display:block;padding:7px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--link)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--mut)}
/* flow */
.flow{max-width:760px}
.node{display:grid;grid-template-columns:70px 1fr;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:10px;text-decoration:none;color:inherit}
.node img{width:70px;border-radius:8px;display:block}.node .alts{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.arrow{margin:4px 0 4px 34px;padding:6px 0 6px 22px;border-left:2px dashed var(--line);color:var(--mut);font-size:13.5px}
.arrow b{color:var(--fg)}
/* library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.snd-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.snd-card audio{width:100%;height:34px;margin:8px 0}
.used{display:flex;gap:5px;flex-wrap:wrap}.used a{font-size:12px;text-decoration:none;background:var(--panel2);border-radius:99px;padding:1px 8px}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stk div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stk img{width:64px;height:64px}
/* shots */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shots img{width:100%;border-radius:8px;display:block;cursor:zoom-in;background:#000}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:50}
.lb.on{display:grid}.lb img{max-width:94vw;max-height:88vh;border-radius:10px}
.lb .cl{position:absolute;top:14px;right:18px;color:#fff;font-size:28px;background:none;border:0;cursor:pointer}
.lb .nv{position:absolute;top:50%;color:#fff;font-size:34px;background:none;border:0;cursor:pointer;padding:20px}
.lb .pv{left:6px}.lb .nx{right:6px}.lb .lbl{position:absolute;bottom:14px;color:#ddd;font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;
  font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:900px){
  .app{grid-template-columns:1fr}aside{display:none}
  .topbar{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px;margin:-28px -16px 16px;border-bottom:1px solid var(--line)}
  .topbar a{white-space:nowrap;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13.5px;background:var(--panel)}
  .topbar a.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
  .reel{grid-template-columns:minmax(0,1fr)}.player{position:static;width:100%;max-width:380px;margin:0 auto}
  .strip{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
</style>
</head>

function isApproved(r) { return !!(r.approved || localApproved()[r.name]); }
const TAGS = {'Approved': 'tg-ok', 'Fixes in progress': 'tg-fix', 'Re-review': 'tg-rev', 'Not seen': 'tg-new', 'Cancelled': 'tg-x'};
function tagOf(r) { return r.cancelled ? 'Cancelled' : isApproved(r) ? 'Approved' : (r.tag || 'Not seen'); }
function tagBadge(r) { const t = tagOf(r); return `<span class="tg ${TAGS[t]}">${t === 'Approved' ? '✓ ' : ''}${t}</span>`; }
let tagFilter = null;
function toggleApproved(name) {
  const a = localApproved(); if (a[name]) delete a[name]; else a[name] = new Date().toISOString().slice(0, 10);
  try { localStorage.setItem('approved', JSON.stringify(a)); } catch (e) {}
  render();
}
function card(r) {
  const img = r.cover ? `<img loading="lazy" src="${r.cover + V}" alt="">` : r.open ? `<img loading="lazy" src="${r.open + V}" alt="">`
    : `<div class="pending">Not rendered yet</div>`;
  return `<a class="card" href="#/r/${r.name}"><div class="thumb">${img}${tagBadge(r)}<span class="n">#${r.n}</span>
    ${r.kind ? `<span class="k">${esc(r.kind)}</span>` : ''}${r.duration ? `<span class="d">${Math.round(r.duration)}s</span>` : ''}</div>
    <div class="body"><div class="t">${esc(r.title)}</div><div class="s">${esc(r.sub || r.place)}</div></div></a>`;
}

function home(only) {
  const mins = all.reduce((a, r) => a + (r.duration || 0), 0) / 60;
  const list = only != null ? [only] : days;
  let h = only != null ? `<div class="crumb"><a href="#/">Reels</a> › Day ${only}</div>` : `
    <h1>${esc(D.trip)} reels</h1>
    <p class="lead">Every reel made so far, day by day. Numbers are the posting order (#1 posts first); each reel's end card teases the next.
      Open a reel for its video, screenshots, stickers and sounds, caption timeline and the ready-to-copy post.
      </p>
    <div class="tagbar">${Object.keys(TAGS).map(t => { const n = all.filter(r => tagOf(r) === t).length;
      return `<button class="tg ${TAGS[t]} ${tagFilter === t ? 'on' : ''}" data-tag="${t}">${t} · ${n}</button>`; }).join('')}
      ${tagFilter ? '<button class="tg tg-new" data-tag="">Show all</button>' : ''}</div>
    <div class="stats"><div class="stat"><b>${all.filter(r => r.rendered).length}</b><span>reels rendered</span></div>
      <div class="stat"><b>${days.length}</b><span>trip days</span></div>
      <div class="stat"><b>${mins.toFixed(1)}</b><span>minutes of video</span></div>
      <div class="stat"><b>${D.library.sounds.length}</b><span>sound effects</span></div>
      <div class="stat"><b>${D.drafts.length}</b><span>in progress</span></div></div>`;
  if (only == null && D.drafts.length) h += `<section class="day"><div class="dayh"><h2>In progress</h2></div><div class="drafts">${
    D.drafts.map(d => `<div class="draft">${d.sheet ? `<img src="${d.sheet + V}" alt="" data-lb="${d.sheet}">` : ''}<b>${esc(d.name)}</b>
      <div class="s mono">${esc(d.info)}</div><span class="tagc">${esc(d.status)}</span></div>`).join('')}</div></section>`;
  for (const d of list) h += `<section class="day" id="day${d}"><div class="dayh"><span class="pill">Day ${d}</span>
    <span class="place">${esc(placeOf(d))}</span><small>${byDay[d].length} reel${byDay[d].length > 1 ? 's' : ''}</small></div>
    <div class="grid">${byDay[d].filter(r => !tagFilter || tagOf(r) === tagFilter).map(card).join('')}</div></section>`;
  return h;
}

function reelChanges(name) {
  const g = (R[name] && R[name].group) || [name];
  const row = e => `<p class="s" style="margin:0 0 8px"><span style="color:var(--mut)">${esc(e.date)}</span> · “${esc(e.said)}”<br>→ ${
    esc(e.did)} <b class="${e.status === 'done' ? 'okt' : ''}">(${esc(e.status)})</b></p>`;
  const mine = (D.changelog || []).filter(e => !e.reels.includes('all') && e.reels.some(n => g.includes(n)));
  const every = (D.changelog || []).filter(e => e.reels.includes('all'));
  return `<div class="panel"><h3>Change log for this reel</h3>${mine.length ? mine.slice().reverse().map(row).join('') :
    '<p class="s" style="margin:0 0 8px;color:var(--mut)">No changes asked for this reel yet.</p>'}${every.length ?
    `<details><summary class="s">Changes applied to every reel (${every.length})</summary>${every.slice().reverse().map(row).join('')}</details>` : ''}</div>`;
}

function reel(name, tab) {
  const r = R[name]; if (!r) return `<p>Unknown reel.</p>`;
  const P = r.prev && R[r.prev], N = r.next && R[r.next];
  const sib = r.group.length > 1 ? `<div class="seg">${r.group.map(g => `<a class="${g === name ? 'on' : ''}" href="#/r/${g}">${
    esc(R[g].kind || 'Main')}</a>`).join('')}</div>` : '';
  const tabs = [['post', 'Post'], ['screens', 'Screens'], ['moments', `Stickers & sounds${r.moments ? ` (${r.moments.length})` : ''}`],
    ['lines', `Captions${r.lines ? ` (${r.lines.length})` : ''}`], ['files', 'Files']];
  tab = tab || 'post';
  const tags = r.hashtags.map(t => '#' + t.replace(/^#/, ''));
  let body = `<div class="panel approve">${tagBadge(r)} ${r.cancelled ? `<span class="s">${esc(r.cancelled)}</span>` : r.approved ? `<b class="okt">✓ Approved</b> <span class="s">(${esc(r.approved)})</span>` :
    `<button class="btn" data-approve="${esc(name)}">${localApproved()[name] ? '✓ Approved (click to undo)' : 'Mark as approved'}</button>
     <button class="btn ghost" data-copyapproved="1">Copy approved list</button>
     <span class="s" style="color:var(--mut)">Saved in this browser; paste the list to Claude to make it permanent.</span>`}</div>`;
  body += reelChanges(name);
  if (!r.rendered) body += `<div class="panel">This reel isn't rendered yet.</div>`;
  else if (tab === 'post') body += `
    ${r.song ? `<div class="panel"><h3>Song to add on Instagram</h3><p class="s" style="margin:0">🎵 <b>${esc(r.song.pick)}</b>
      <span style="color:var(--mut)">· ${esc(r.song.status)}</span><br>Alt: ${esc(r.song.alt)}<br>Why: ${esc(r.song.why)}<br>
      How: ${esc(r.song.where)}</p>${D.songs_about && D.songs_about.rules ? `<details style="margin-top:8px"><summary class="s">How to add it</summary>${
      D.songs_about.rules.map(x => `<p class="s" style="margin:6px 0 0">• ${esc(x)}</p>`).join('')}<p class="s" style="color:var(--mut);margin:6px 0 0">Checked ${esc(D.songs_about.checked)}</p></details>` : ''}</div>` : ''}
    <div class="panel"><h3>Instagram caption</h3><pre class="cap">${esc(r.caption)}</pre>
      <div class="tags">${tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
      <button class="btn" data-copy="${esc(r.caption + '\n\n' + tags.join(' '))}">Copy caption + hashtags</button>
      ${r.send_to ? `<p class="s" style="color:var(--mut);margin:10px 0 0">Send to: ${esc(r.send_to)}</p>` : ''}</div>
    <div class="panel"><h3>Cover & end card</h3><div class="two">
      ${r.cover ? `<figure><img src="${r.cover + V}" data-lb="${r.cover}" alt=""><figcaption>Cover: “${esc(r.cover_title)}”</figcaption></figure>` : ''}
      <figure><img src="${r.end + V}" data-lb="${r.end}" alt=""><figcaption>End card: “${esc(r.endcard)}”</figcaption></figure></div></div>
    <div class="panel"><h3>When you post</h3><p class="s" style="margin:0">${P ? `In Instagram, tap <b>Link a reel</b> and choose
      <a href="#/r/${P.name}">#${P.n} “${esc(P.title)}”</a>. The two reels get connected by a “Watch Part” button.` :
      'This is the first reel in the series: nothing to link yet.'} Post it as a <b>Trial Reel</b> first if you want to test the cold open.</p></div>
    ${N ? `<div class="panel"><h3>The end card leads to</h3><a class="next" href="#/r/${N.name}">${N.cover ? `<img src="${N.cover + V}" alt="">` : ''}
      <div><small>#${N.n} · Day ${N.day} · ${esc(N.place)}</small><b>${esc(N.title)}</b></div></a></div>` : ''}`;
  else if (tab === 'screens') body += `
    <div class="panel"><h3>Opening & end card</h3><div class="two"><figure><img src="${r.open + V}" data-lb="${r.open}" alt="">
      <figcaption>2.5 s in</figcaption></figure><figure><img src="${r.end + V}" data-lb="${r.end}" alt=""><figcaption>End card</figcaption></figure></div></div>
    <div class="panel"><h3>Filmstrip: click a frame to jump there</h3><div class="strip">${r.strip.map(s =>
      `<button data-seek="${s.t}"><img loading="lazy" src="${s.src + V}" alt=""><span>${fmt(s.t)}</span></button>`).join('')}</div></div>`;
  else if (tab === 'moments') body += `<div class="panel"><h3>Every sticker, sound, pause and label: click to play from there</h3>${
    r.moments.length ? r.moments.map(m => `<div class="mom" data-seek="${Math.max(0, m.t - 0.8)}"><div class="time">${fmt(m.t)}</div>
      <img loading="lazy" src="${m.src + V}" alt=""><div><div class="what k-${m.kind}">${
        m.kind === 'sticker' ? `${m.emoji} sticker${m.label ? ` “${esc(m.label)}”` : ''}` : m.kind === 'pause' ? `⏸ Pause: ${esc(m.label)}`
        : m.kind === 'sound' ? '🔊 Sound' : m.kind === 'freeze' ? `❄ Freeze: ${esc(m.label)}` : m.kind === 'behind' ? `Big text: ${esc(m.label)}`
        : `Label: ${esc(m.label)}`}</div>${m.sounds.length ? `<div class="snd">🔊 ${m.sounds.map(esc).join(', ')}</div>` : ''}</div></div>`).join('')
    : '<p class="s">No stickers or sounds on this reel.</p>'}</div>`;
  else if (tab === 'lines') body += `<div class="panel"><h3>Captions as they appear: the current line lights up while playing</h3>${
    r.lines.map((l, i) => `<div class="line" data-seek="${l.s}" data-i="${i}"><div class="time">${fmt(l.s)}</div><div>${esc(l.text)}</div></div>`).join('')
    || '<p class="s">No captions.</p>'}</div>`;
  else if (tab === 'files') body += `<div class="panel files"><h3>Files</h3>
      <a href="${dview(r.video)}" target="_blank">${esc(r.name)}.mp4 · the post (${r.duration} s, end card included)</a>
      ${r.extras.map(x => `<a href="${dview(x.href)}" target="_blank">${esc(x.label)}</a>`).join('')}
      ${r.cover ? `<a href="${r.cover}">Cover image</a>` : ''}
      <p class="mono" style="margin-top:12px">~/Downloads/reels/${esc(r.name)}/ · rendered ${esc(r.mtime)}</p></div>
    <div class="panel"><h3>Audio</h3><p class="s">${r.music ? `🎵 Music bed: ${esc(r.music)}<br>` : 'No music baked in.<br>'}${
      r.isolation != null ? `Voices isolated, background at ${r.isolation} dB.` : 'Original sound.'}</p></div>`;
  return `<div class="crumb"><a href="#/">Reels</a> › <a href="#/day/${r.day}">Day ${r.day}</a> › ${esc(r.title)}</div>
  <div class="reel"><div class="player">${r.rendered ? `${DRIVE[r.video] ? `<iframe class="dplayer" src="https://drive.google.com/file/d/${DRIVE[r.video]}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>` : `<div class="dplayer" style="display:grid;place-items:center;color:#fff">Video uploading…</div>`}` : ''}
    <div class="pn"><a class="${P ? '' : 'dis'}" href="${P ? '#/r/' + P.name : '#'}"><small>← Posted before</small><span>${P ? esc(P.title) : '—'}</span></a>
      <a class="r ${N ? '' : 'dis'}" href="${N ? '#/r/' + N.name : '#'}"><small>Posted after →</small><span>${N ? esc(N.title) : '—'}</span></a></div></div>
  <div><h1>${esc(r.title)}</h1>${r.sub ? `<p class="lead" style="margin:0">${esc(r.sub)}</p>` : ''}
    <div class="chips"><span class="chip acc">Day ${r.day}</span><span class="chip">${esc(r.place)}</span><span class="chip">#${r.n} in posting order</span>
      ${r.duration ? `<span class="chip">${r.duration} s</span>` : ''}${r.kind ? `<span class="chip">${esc(r.kind)}</span>` : ''}</div>
    ${sib}<div class="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div id="tabbody">${body}</div></div></div>`;
}

function flow() {
  let h = `<h1>Series flow</h1><p class="lead">The posting chain. Each reel ends on a 3 s card that teases the next one, so viewers follow to see it.</p><div class="flow">`;
  mains.forEach((r, i) => {
    const alts = r.group.slice(1).map(g => `<a class="tagc" href="#/r/${g}">${esc(R[g].kind)}</a>`).join('');
    h += `<a class="node" href="#/r/${r.name}">${r.cover ? `<img src="${r.cover + V}" alt="">` : '<span></span>'}<div>
      <small class="s" style="color:var(--mut)">#${r.n} · Day ${r.day} · ${esc(r.place)}</small><div><b>${esc(r.title)}</b></div>
      ${alts ? `<div class="alts">${alts}</div>` : ''}</div></a>`;
    if (r.endcard) h += `<div class="arrow">End card: <b>“${esc(r.endcard)}”</b></div>`;
  });
  return h + '</div>';
}

function library(tab) {
  const L = D.library; tab = tab || 'sounds';
  const used = u => u.length ? `<div class="used">${u.map(n => `<a href="#/r/${n}">${esc(R[n]?.title || n)}${R[n]?.kind ? ' · ' + esc(R[n].kind) : ''}</a>`).join('')}</div>`
    : '<span class="s" style="color:var(--mut);font-size:12.5px">Not used yet</span>';
  let body = '';
  if (tab === 'sounds') body = `<p class="lead">Mixkit free-licence sound effects (no credit needed), evened out to the same loudness. Mixed in after the voice pass.</p>
    <div class="lib">${L.sounds.map(s => `<div class="snd-card"><b>${esc(s.name)}</b> <span class="mono">${esc(s.id)}</span>
      <audio controls preload="none" src="${s.src}"></audio>${used(s.used)}</div>`).join('')}</div>`;
  else if (tab === 'stickers') body = `<p class="lead">Emoji stickers (Google Noto, Apache 2.0) that pop in and wobble in a corner of the picture.</p>
    <div class="stk">${L.stickers.map(s => `<div><img src="${s.src}" alt="${esc(s.emoji)}">${used(s.used)}</div>`).join('')}</div>`;
  else body = `<p class="lead">Royalty-free / Creative Commons tracks (first 60 s here). Credit goes in the post caption.</p>
    <div class="lib">${L.music.map(m => `<div class="snd-card"><b>${esc(m.title)}</b><div class="s" style="color:var(--mut)">${esc(m.artist)} · ${esc(m.license)}</div>
      <audio controls preload="none" src="${m.src}"></audio>${used(m.used)}</div>`).join('')}</div>`;
  return `<h1>Library</h1><div class="tabs">${[['sounds', `Sounds (${L.sounds.length})`], ['stickers', `Stickers (${L.stickers.length})`],
    ['music', `Music (${L.music.length})`]].map(([k, l]) => `<button data-ltab="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('')}</div>${body}`;
}

function shots() {
  return `<h1>Screenshots</h1><p class="lead">Every mockup made for approval before rendering, newest groups included. Click to enlarge; ← → to browse.</p>` +
    D.shots.map(g => `<section class="day"><div class="dayh"><h2>${esc(g.title)}</h2><small>${g.images.length}</small></div>
      <div class="shots">${g.images.map(i => `<img loading="lazy" src="${i}" data-lb="${i}" alt="">`).join('')}</div></section>`).join('');
}

let curTab = {}, libTab = 'sounds';
function render() {
  const h = location.hash || '#/', parts = h.slice(2).split('/');
  const view = parts[0] || '', arg = decodeURIComponent(parts[1] || '');
  const navKey = view === 'r' || view === 'day' || view === '' ? '#/' : '#/' + view;
  const navHTML = NAV.map(([href, ico, l]) => `<a class="${href === navKey ? 'on' : ''}" href="${href}"><span class="ico">${ico}</span>${l}</a>`).join('');
  $('#nav').innerHTML = navHTML;
  let html = view === 'r' ? reel(arg, curTab[arg]) : view === 'flow' ? flow() : view === 'library' ? library(libTab)
    : view === 'shots' ? shots() : view === 'day' ? home(Number(arg)) : home();
  $('#main').innerHTML = `<nav class="topbar">${NAV.map(([href, , l]) => `<a class="${href === navKey ? 'on' : ''}" href="${href}">${l}</a>`).join('')}${
    days.map(d => `<a href="#/day/${d}">Day ${d}</a>`).join('')}</nav>` + html;
  if (view !== 'r') window.scrollTo(0, 0);
  wire(view, arg);
}
function wire(view, arg) {
  const vid = $('#vid');
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    curTab[arg] = b.dataset.tab; const t = vid ? vid.currentTime : 0, playing = vid && !vid.paused;
    const y = window.scrollY; render(); const v2 = $('#vid'); if (v2) { v2.currentTime = t; if (playing) v2.play(); } window.scrollTo(0, y);
  });
  document.querySelectorAll('[data-ltab]').forEach(b => b.onclick = () => { libTab = b.dataset.ltab; render(); });
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy));
  document.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => { tagFilter = b.dataset.tag || null; render(); });
  document.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => toggleApproved(b.dataset.approve));
  document.querySelectorAll('[data-copyapproved]').forEach(b => b.onclick = () => copy('Approved reels: ' +
    Object.keys(localApproved()).concat(D.order.filter(n => R[n].approved)).filter((v, i, a) => a.indexOf(v) === i).join(', ')));
  document.querySelectorAll('[data-jump]').forEach(b => b.onclick = e => { e.preventDefault(); document.getElementById(b.dataset.jump)?.scrollIntoView({behavior: 'smooth'}); });
  document.querySelectorAll('[data-seek]').forEach(el => el.onclick = () => {
    if (!vid) return; vid.currentTime = Number(el.dataset.seek); vid.play();
    if (innerWidth <= 900) vid.scrollIntoView({behavior: 'smooth', block: 'center'});
  });
  if (vid && view === 'r') {
    const lines = R[arg].lines || [];
    vid.ontimeupdate = () => {
      const t = vid.currentTime;
      document.querySelectorAll('.line').forEach(el => { const l = lines[el.dataset.i]; el.classList.toggle('on', t >= l.s && t <= l.e); });
    };
  }
  const imgs = [...document.querySelectorAll('[data-lb]')];
  imgs.forEach((im, i) => im.onclick = () => openLb(imgs.map(x => x.dataset.lb), i));
}
let lbList = [], lbI = 0;
function openLb(list, i) { lbList = list; lbI = i; showLb(); $('#lb').classList.add('on'); }
function showLb() { $('#lb img').src = lbList[lbI] + V; $('#lb .lbl').textContent = `${lbI + 1} / ${lbList.length}`; }
$('#lb .cl').onclick = () => $('#lb').classList.remove('on');
$('#lb').onclick = e => { if (e.target.id === 'lb') $('#lb').classList.remove('on'); };
$('#lb .pv').onclick = e => { e.stopPropagation(); lbI = (lbI + lbList.length - 1) % lbList.length; showLb(); };
$('#lb .nx').onclick = e => { e.stopPropagation(); lbI = (lbI + 1) % lbList.length; showLb(); };
addEventListener('keydown', e => {
  if (!$('#lb').classList.contains('on')) return;
  if (e.key === 'Escape') $('#lb').classList.remove('on');
  if (e.key === 'ArrowLeft') $('#lb .pv').click();
  if (e.key === 'ArrowRight') $('#lb .nx').click();
});
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
